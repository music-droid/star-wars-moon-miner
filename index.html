<canvas id="c"></canvas>
<div id="ap"><label>♪ Music <input id="mv" type="range" min="0" max="100"></label><label>✦ SFX <input id="sv" type="range" min="0" max="100"></label><button id="mb">Mute (M)</button></div>
<script>
'use strict';
// ================= CANVAS =================
const FB="'SWMM Gothic','News Gothic MN','Franklin Gothic Medium',system-ui,sans-serif",FT='"Trebuchet MS","SWMM Gothic",system-ui,sans-serif',FW="'SWMM Wide',system-ui,sans-serif";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const lightC=document.createElement('canvas'),lctx=lightC.getContext('2d');
let W=0,H=0,DPR=1;const LS=0.5;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.round(cv.clientWidth||innerWidth);H=Math.round(cv.clientHeight||innerHeight);cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);lightC.width=Math.ceil(W*LS)+1;lightC.height=Math.ceil(H*LS)+1;}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));if(window.visualViewport)visualViewport.addEventListener('resize',resize);setInterval(()=>{const w=Math.round(cv.clientWidth||innerWidth),h=Math.round(cv.clientHeight||innerHeight);if(w!==W||h!==H)resize()},250);

// ================= UTILS =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);

// ================= AUDIO =================
const ACx=window.AudioContext||window.webkitAudioContext;
let ac=null,master,musicBus,musicIn,sfxBus,noiseBuf,revIn;
let musicVol=+(localStorage.getItem('nm_mv')??70),sfxVol=+(localStorage.getItem('nm_sv')??80),muted=localStorage.getItem('nm_mute')==='1';
function applyVolumes(){if(!ac)return;const t=ac.currentTime;master.gain.setTargetAtTime(muted?0:1,t,0.05);musicBus.gain.setTargetAtTime((musicVol/100)*0.9*(state==='pause'?0.4:1),t,0.1);sfxBus.gain.setTargetAtTime(sfxVol/100*0.8,t,0.05);}
function iosKick(){try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
['touchend','click','keydown','pointerup'].forEach(ev=>document.addEventListener(ev,()=>unlockAudio(),{capture:true,passive:true}));
function unlockAudio(){
  if(ac){if(ac.state!=='running'){ac.resume();iosKick()}return}
  if(!ACx)return;
  try{ac=new ACx()}catch(e){return}
  iosKick();if(ac.state!=='running')ac.resume();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.connect(comp);
  musicBus=ac.createGain();musicBus.connect(master);sfxBus=ac.createGain();sfxBus.connect(master);
  musicIn=ac.createGain();musicIn.connect(musicBus);
  // hall reverb
  const len=ac.sampleRate*2.8|0,ib=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ac.createConvolver();conv.buffer=ib;revIn=ac.createGain();revIn.gain.value=0.32;musicIn.connect(revIn);revIn.connect(conv);const rg=ac.createGain();rg.gain.value=0.9;conv.connect(rg);rg.connect(musicBus);
  const sr=ac.createGain();sr.gain.value=0.12;sfxBus.connect(sr);sr.connect(conv);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  applyVolumes();
  if(Music.want!==undefined){const w=Music.want;Music.want=undefined;Music.play(w)}
}
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const NF={};
function nf(n){if(typeof n==='number')return n;if(NF[n])return NF[n];const m=/^([A-G][#b]?)(-?\d)$/.exec(n);const midi=NOTE[m[1]]+12*(+m[2]+1);return NF[n]=440*Math.pow(2,(midi-69)/12)}
const tr=(n,s)=>nf(n)*Math.pow(2,s/12);
function O(type,f,t,stop,dst,det){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.connect(dst);o.start(t);o.stop(stop);return o}
function Gn(dst,v=0){const g=ac.createGain();g.gain.value=v;g.connect(dst);return g}
function Fl(dst,type,f,q=1){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(dst);return b}
function Nz(t,dur,dst){const s=ac.createBufferSource();s.buffer=noiseBuf;s.connect(dst);s.start(t,Math.random()*1.4,dur+0.05);return s}
// --- instruments
function brass(dst,t,n,dur,v,bright=1){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'lowpass',f*2,1.3);const dec=Math.min(0.15,dur*0.5);
  fl.frequency.setValueAtTime(f*1.2,t);fl.frequency.linearRampToValueAtTime(Math.min(9000,f*(3+3*bright)+500),t+0.07);fl.frequency.linearRampToValueAtTime(Math.min(7000,f*(2+1.6*bright)+250),t+Math.max(0.12,dur));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.035);g.gain.linearRampToValueAtTime(v*0.75,t+0.035+dec);g.gain.setValueAtTime(v*0.75,t+Math.max(dur,0.04+dec));g.gain.linearRampToValueAtTime(0,t+Math.max(dur,0.04+dec)+0.14);
  const e=t+dur+0.4;O('sawtooth',f,t,e,fl,-7);O('sawtooth',f,t,e,fl,7)}
function strings(dst,t,n,dur,v,att=0.3){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'lowpass',Math.min(5000,f*4+300),0.6);const d=Math.max(att,dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setValueAtTime(v,t+d);g.gain.linearRampToValueAtTime(0,t+d+0.6);
  const e=t+d+0.7;for(const dd of[-10,0,10])O('sawtooth',f,t,e,fl,dd)}
function stacc(dst,t,f,v){const g=Gn(dst,0),fl=Fl(g,'lowpass',1500,1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);O('sawtooth',f,t,t+0.15,fl,-8);O('sawtooth',f,t,t+0.15,fl,8)}
function timp(dst,t,n,v){const f=nf(n),g=Gn(dst,0);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.3);const o=O('sine',f*1.5,t,t+1.35,g);o.frequency.exponentialRampToValueAtTime(f,t+0.06);
  const g2=Gn(dst,0),fl=Fl(g2,'lowpass',380,1);g2.gain.setValueAtTime(v*0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.18);Nz(t,0.2,fl)}
function snare(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',1300,0.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);Nz(t,0.17,fl);
  const g2=Gn(dst,0);g2.gain.setValueAtTime(v*0.6,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.06);O('triangle',190,t,t+0.07,g2)}
function hat(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',8000,0.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);Nz(t,0.06,fl)}
function cym(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',6000,0.5);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.8);Nz(t,1.85,fl)}
function wood(dst,t,n,v){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'bandpass',f*3,5);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);Nz(t,0.06,fl);

function drawTile(x,y){if(x<0||y<0||x>=MW||y>=MH)return;const c=mctx,px=x*T,py=y*T,t=map[y*MW+x],h=hash(x,y),h2=hash(y+91,x+17);

function overlap(x,y,r,cb){const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);let hit=false;

function moveEnt(e,dx,dy,r,cb){let hx=false,hy=false;
  e.x+=dx;if(overlap(e.x,e.y,r,cb)){e.x-=dx;hx=true}

function flowDir(m){const tx=Math.floor(m.x/T),ty=Math.floor(m.y/T);const dx=ship.x-m.x,dy=ship.y-m.y,dd=Math.hypot(dx,dy)||1;
  if(!flow)return[dx/dd,dy/dd];const cd=flow[ty*MW+tx];if(cd<0||dd<T*1.2)return[dx/dd,dy/dd];
  let best=cd,bx=tx,by=ty;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const nx=tx+a,ny=ty+b;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    if(a&&b&&(solidAt(tx+a,ty)||solidAt(tx,ty+b)))continue;const v=flow[ny*MW+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny}}
  if(best===cd)return[dx/dd,dy/dd];const ex=(bx+0.5)*T-m.x,ey=(by+0.5)*T-m.y,ed=Math.hypot(ex,ey)||1;return[ex/ed,ey/ed]}

  ctx.font='15px '+FW;ctx.fillStyle='#ffd98a';lines.forEach((l,i)=>ctx.fillText(l,W/2,H*0.3+80+i*24));
  if(stateT>0.8){ctx.fillStyle=`rgba(140,255,200,${0.6+0.4*Math.sin(stateT*4)})`;ctx.font='bold 17px '+FB;ctx.fillText(touchMode?'Tap to continue':'Press ENTER to continue',W/2,H*0.3+90+lines.length*24+20)}}
const EPI=['The Hive Mother is fallen. The deep moons fall silent.','Your lift rises through the dark, its hold glowing with crystals —','enough plasma to light every lantern in the cities above.','','But the rock remembers. Deeper sectors are calling…'];

function drawBriefing(t){briefT+=1/60;ctx.fillStyle='rgba(2,4,10,0.82)';ctx.fillRect(0,0,W,H);const sm=W<640;
  ctx.textAlign='center';ctx.fillStyle='#8fa6c0';ctx.font=`bold ${sm?11:13}px ${FW}`;ctx.fillText(level<=8?`MISSION ${level} OF 8  ·  ${cfg.moon}`:`ENDLESS SECTOR ${level}  ·  ${cfg.moon}`,W/2,H*0.12);
  chromeText(cfg.name.toUpperCase(),W/2,H*0.12+(sm?34:48),Math.min(44,W/14));
  const w=Math.min(720,W-24),x=W/2-w/2;let y=H*0.12+(sm?54:76);
  if(briefIdx<cfg.brief.length){const[who,text]=cfg.brief[briefIdx];dialogBox(who,text,x,y,w,Math.floor(briefT*55),t);
    ctx.fillStyle='#667';ctx.font='12px '+FB;ctx.textAlign='right';ctx.fillText(`${briefIdx+1}/${cfg.brief.length}`,x+w-12,y+20)}
  else{rrect(x,y,w,150,12);ctx.fillStyle='rgba(8,12,22,0.88)';ctx.fill();ctx.strokeStyle='#6c8';ctx.stroke();ctx.textAlign='left';ctx.fillStyle='#8f8';ctx.font='bold 14px '+FB;ctx.fillText('MISSION OBJECTIVES',x+18,y+28);
    ctx.font='14px '+FB;ctx.fillStyle='#e8eef6';const ob=[];if(rescueNeed)ob.push(`Rescue ${rescueNeed} stranded miners (yellow beacons)`);if(need)ob.push(`Collect ${need} plasma crystals`);
    if(intelTotal)ob.push(intelNeed?`Recover ${intelNeed} pieces of intel (orange)`:`Optional: recover ${intelTotal} intel item${intelTotal>1?'s':''} (orange)`);if(bossLevel)ob.push('Survive whatever is nesting near the lift');
    if(timed)ob.push(`Beat the clock: ${Math.floor(timeMax/60)}:${String(timeMax%60).padStart(2,'0')}`);ob.push(level===8?'Reach the COMM RELAY and transmit the evidence':'Reach the extraction lift');
    ob.forEach((o,i)=>ctx.fillText('▸ '+o,x+22,y+54+i*20))}
  ctx.textAlign='center';ctx.fillStyle=`rgba(140,255,200,${0.6+0.4*Math.sin(t*4)})`;ctx.font='bold 14px '+FB;
  ctx.fillText(touchMode?'Tap to continue':(briefIdx<cfg.brief.length?'ENTER: next   ·   ESC: skip briefing':'ENTER: launch mission'),W/2,H-28)}
function drawEpilogue(t){epiT+=1/60;drawStars(t);drawMoon(t);ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);const e=EPILOGUE[epiIdx];
  if(e[0]!=='END'){chromeText('EPILOGUE',W/2,H*0.18,Math.min(46,W/12));const w=Math.min(720,W-24);dialogBox(e[0],e[1],W/2-w/2,H*0.26,w,Math.floor(epiT*55),t);

  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';const fs=Math.min(20,W/34);ctx.font=`${fs}px ${FB}`;
  const L=['Days later, the royal cruiser touched down on a landing platform on Coruscant.','It exploded moments after landing. The decoy handmaiden aboard was lost.','But the Senator was not aboard. She had flown in safely with the starfighter escort.','','The agitators had failed. Their war was only beginning.'];
  L.forEach((l,i)=>{ctx.globalAlpha=clamp(epiT*0.7-i*0.5,0,1);ctx.fillStyle='#e8dcb0';ctx.fillText(l,W/2,H*0.25+i*fs*1.6)});ctx.globalAlpha=clamp(epiT*0.8-2.5,0,1);
  ctx.fillStyle='#4bd5ee';ctx.font=`italic ${fs*1.2}px ${FB}`;ctx.fillText('What happened next...',W/2,H*0.62);ctx.fillStyle='#f3d27a';ctx.font=`bold ${fs*1.5}px ${FB}`;ctx.fillText('watch Star Wars: Episode II.',W/2,H*0.62+fs*2.4);ctx.globalAlpha=1;
  if(epiT>5){ctx.fillStyle='#8fc';ctx.font='bold 14px '+FB;ctx.fillText(touchMode?'Tap to continue into endless sectors':'Press ENTER to continue into endless sectors',W/2,H*0.84)}}
// ================= MAIN LOOP =================
let lastT=performance.now();
function frame(now){const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;const t=now/1000;stateT+=dt;
  try{
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(state==='gate'||state==='crawl'||state==='menu'){drawTitle(t)}
    else{
      if(state==='play')updatePlay(dt);
      if(state==='dying'){gameT+=dt;if(stateT>1.8)setState('over');for(const m of mobs){m.t+=dt}}
      if(state!=='pause')updateParts(dt);
      shake=Math.max(0,shake-dt*30)*(state==='pause'?0:1);
      if(ship){const tx=ship.x+ship.vx*0.25-W/2,ty=ship.y+ship.vy*0.25-H/2;const k=1-Math.exp(-dt*6);cam.x=lerp(cam.x,tx,k);cam.y=lerp(cam.y,ty,k)}
      drawWorld(t);
      if(state==='play'||state==='pause'||state==='dying')drawHUD(t);
      if(state==='epilogue'||state==='briefing'){}
      if(state==='pause'){overlay('PAUSED','Press P / Esc to resume · Q to quit to title',[`Mission ${level}   ·   Crystals ${got}/${need}   ·   Intel ${intelGot}/${intelTotal}   ·   Score ${score}`],'chrome');
        if(evidence.length){ctx.textAlign='left';ctx.font='bold 13px '+FB;ctx.fillStyle='#ff9a3c';const x=Math.max(16,W/2-300);let y=H*0.3+150;ctx.fillText('EVIDENCE LOG',x,y);y+=20;ctx.font='13px '+FB;ctx.fillStyle='#f0d8b8';
          for(const e of evidence.slice(-7)){for(const l of wrapLines(`[M${e.lv}] ${e.text}`,Math.min(600,W-32))){ctx.fillText(l,x,y);y+=16}}}}
      if(state==='levelDone')overlay(level===8?'EVIDENCE TRANSMITTED':'MISSION COMPLETE',level===8?'The comm relay crackles. Your files are on their way to the RSF.':'The lift hums upward with its glowing cargo.',[`Crystals: ${got}   Creatures destroyed: ${lvStats.kills}`,`Time: ${Math.round(lvStats.time)}s   Bonus: +${lvStats.bonus}`,`Score: ${score}`],'#8f8');
      if(state==='over')overlay('MISSION FAILED',overReason,[`Reached sector ${level}   ·   Final score ${score}`,score>=hi&&score>0?'★ NEW HIGH SCORE ★':`High score ${hi}`],'#f66');
      if(state==='briefing')drawBriefing(t);
      if(state==='epilogue')drawEpilogue(t);
    }
  }catch(e){console.error(e)}
  requestAnimationFrame(frame)}
resize();
const fontsReady=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([`16px ${FB}`,`bold 16px ${FB}`,`16px ${FW}`,`bold 16px ${FT}`].map(f=>document.fonts.load(f).catch(()=>null))).then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,3000))]):Promise.resolve();
fontsReady.then(()=>{renderCrawl();lastT=performance.now();requestAnimationFrame(frame)});

  setLevel(l){level=l},startGame,startLevel,trySpawn,setState,T,setMode,giveCrystals(n){got+=n},get intel(){return[intelGot,intelTotal,intelNeed]},get rescue(){return[rescued,rescueNeed]},get miners(){return miners},get brief(){return[briefIdx,cfg&&cfg.brief.length]},get epi(){return epiIdx},get comm(){return comm},get leader(){return leaderRevealed},get timeLeft(){return timeLeft},get music(){return Music.cur&&Music.cur.name},get ac(){return ac&&ac.state}};
