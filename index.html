<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Wars: Moon Miner</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block}
#ap{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:8px 14px;background:rgba(10,14,24,.8);border:1px solid rgba(180,200,230,.3);border-radius:10px;color:#cfe3f0;font-size:13px;z-index:2;flex-wrap:wrap;justify-content:center}
#ap input{width:110px;accent-color:#6cf}
#ap button{background:#223047;color:#dfeaff;border:1px solid #4a6a90;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ap"><label>♪ Music <input id="mv" type="range" min="0" max="100"></label><label>✦ SFX <input id="sv" type="range" min="0" max="100"></label><button id="mb">Mute (M)</button></div>
<script>
'use strict';
// ================= CANVAS =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const lightC=document.createElement('canvas'),lctx=lightC.getContext('2d');
let W=0,H=0,DPR=1;const LS=0.5;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';lightC.width=Math.ceil(W*LS)+1;lightC.height=Math.ceil(H*LS)+1;}
addEventListener('resize',resize);

// ================= UTILS =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);

// ================= AUDIO =================
const ACx=window.AudioContext||window.webkitAudioContext;
let ac=null,master,musicBus,musicIn,sfxBus,noiseBuf,revIn;
let musicVol=+(localStorage.getItem('nm_mv')??70),sfxVol=+(localStorage.getItem('nm_sv')??80),muted=localStorage.getItem('nm_mute')==='1';
function applyVolumes(){if(!ac)return;const t=ac.currentTime;master.gain.setTargetAtTime(muted?0:1,t,0.05);musicBus.gain.setTargetAtTime((musicVol/100)*0.9*(state==='pause'?0.4:1),t,0.1);sfxBus.gain.setTargetAtTime(sfxVol/100*0.8,t,0.05);}
function iosKick(){try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
['touchend','click','keydown','pointerup'].forEach(ev=>document.addEventListener(ev,()=>unlockAudio(),{capture:true,passive:true}));
function unlockAudio(){
  if(ac){if(ac.state!=='running'){ac.resume();iosKick()}return}
  if(!ACx)return;
  try{ac=new ACx()}catch(e){return}
  iosKick();if(ac.state!=='running')ac.resume();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.connect(comp);
  musicBus=ac.createGain();musicBus.connect(master);sfxBus=ac.createGain();sfxBus.connect(master);
  musicIn=ac.createGain();musicIn.connect(musicBus);
  // hall reverb
  const len=ac.sampleRate*2.8|0,ib=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ac.createConvolver();conv.buffer=ib;revIn=ac.createGain();revIn.gain.value=0.32;musicIn.connect(revIn);revIn.connect(conv);const rg=ac.createGain();rg.gain.value=0.9;conv.connect(rg);rg.connect(musicBus);
  const sr=ac.createGain();sr.gain.value=0.12;sfxBus.connect(sr);sr.connect(conv);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  applyVolumes();
  if(Music.want!==undefined){const w=Music.want;Music.want=undefined;Music.play(w)}
}
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const NF={};
function nf(n){if(typeof n==='number')return n;if(NF[n])return NF[n];const m=/^([A-G][#b]?)(-?\d)$/.exec(n);const midi=NOTE[m[1]]+12*(+m[2]+1);return NF[n]=440*Math.pow(2,(midi-69)/12)}
const tr=(n,s)=>nf(n)*Math.pow(2,s/12);
function O(type,f,t,stop,dst,det){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.connect(dst);o.start(t);o.stop(stop);return o}
function Gn(dst,v=0){const g=ac.createGain();g.gain.value=v;g.connect(dst);return g}
function Fl(dst,type,f,q=1){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(dst);return b}
function Nz(t,dur,dst){const s=ac.createBufferSource();s.buffer=noiseBuf;s.connect(dst);s.start(t,Math.random()*1.4,dur+0.05);return s}
// --- instruments
function brass(dst,t,n,dur,v,bright=1){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'lowpass',f*2,1.3);const dec=Math.min(0.15,dur*0.5);
  fl.frequency.setValueAtTime(f*1.2,t);fl.frequency.linearRampToValueAtTime(Math.min(9000,f*(3+3*bright)+500),t+0.07);fl.frequency.linearRampToValueAtTime(Math.min(7000,f*(2+1.6*bright)+250),t+Math.max(0.12,dur));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.035);g.gain.linearRampToValueAtTime(v*0.75,t+0.035+dec);g.gain.setValueAtTime(v*0.75,t+Math.max(dur,0.04+dec));g.gain.linearRampToValueAtTime(0,t+Math.max(dur,0.04+dec)+0.14);
  const e=t+dur+0.4;O('sawtooth',f,t,e,fl,-7);O('sawtooth',f,t,e,fl,7)}
function strings(dst,t,n,dur,v,att=0.3){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'lowpass',Math.min(5000,f*4+300),0.6);const d=Math.max(att,dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setValueAtTime(v,t+d);g.gain.linearRampToValueAtTime(0,t+d+0.6);
  const e=t+d+0.7;for(const dd of[-10,0,10])O('sawtooth',f,t,e,fl,dd)}
function stacc(dst,t,f,v){const g=Gn(dst,0),fl=Fl(g,'lowpass',1500,1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);O('sawtooth',f,t,t+0.15,fl,-8);O('sawtooth',f,t,t+0.15,fl,8)}
function timp(dst,t,n,v){const f=nf(n),g=Gn(dst,0);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.3);const o=O('sine',f*1.5,t,t+1.35,g);o.frequency.exponentialRampToValueAtTime(f,t+0.06);
  const g2=Gn(dst,0),fl=Fl(g2,'lowpass',380,1);g2.gain.setValueAtTime(v*0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.18);Nz(t,0.2,fl)}
function snare(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',1300,0.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);Nz(t,0.17,fl);
  const g2=Gn(dst,0);g2.gain.setValueAtTime(v*0.6,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.06);O('triangle',190,t,t+0.07,g2)}
function hat(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',8000,0.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);Nz(t,0.06,fl)}
function cym(dst,t,v){const g=Gn(dst,0),fl=Fl(g,'highpass',6000,0.5);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.8);Nz(t,1.85,fl)}
function wood(dst,t,n,v){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'bandpass',f*3,5);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);Nz(t,0.06,fl);
  const g2=Gn(dst,0),f2=Fl(g2,'lowpass',f*4,1);g2.gain.setValueAtTime(v*0.8,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.09);O('sawtooth',f,t,t+0.1,f2)}
function pizz(dst,t,n,v){const f=nf(n),g=Gn(dst,0),fl=Fl(g,'lowpass',f*5,1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);O('triangle',f,t,t+0.42,fl);O('sine',f*2,t,t+0.2,g)}
function cel(dst,t,n,v){const f=nf(n),g=Gn(dst,0);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.4);O('sine',f,t,t+1.45,g);const g2=Gn(dst,0);g2.gain.setValueAtTime(v*0.3,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.4);O('sine',f*4,t,t+0.45,g2)}
function battle(dst,t,b,beats,bass,ch){
  const acc=[0,3,6,8,11,14];
  for(let k=0;k<beats*4;k++)stacc(dst,t+k*b/4,tr(bass,12),acc.includes(k%16)?0.09:0.04);
  for(let k=0;k<beats;k++){if(k%2===1)snare(dst,t+k*b,0.28);else if(Math.random()<0.6)snare(dst,t+(k+0.75)*b,0.08)}
  for(const p of[0,1.5,2])if(p<beats)timp(dst,t+p*b,tr(bass,12),0.38);
  for(const p of[1.5,3.5])if(p<beats)for(const n of ch)brass(dst,t+p*b,n,b*0.3,0.05,0.8);
}
// --- tracks
const TRACKS={};
{ // 1. Title: heroic fanfare, C major march, 108bpm (original)
  const M=[[['C4',1],['G4',1.5],['A4',.5],['G4',1]],[['E5',3],['D5',.5],['C5',.5]],[['D5',1],['B4',1],['G4',1],['D5',1]],[['D5',4]],
           [['A4',1],['F5',1.5],['E5',.5],['D5',1]],[['C5',1],['E5',1],['G5',2]],[['F5',.5],['E5',.5],['D5',1],['B4',1],['G4',1]],[['C5',4]]];
  const C=[['C4','E4','G4'],['A3','C4','E4'],['G3','B3','D4'],['G3','B3','D4'],['F3','A3','C4'],['C4','E4','G4'],['G3','B3','D4'],['C4','E4','G4']];
  const R=['C2','A1','G1','G1','F1','C2','G1','C2'];
  TRACKS.title={bar(c,t,i){const b=60/108,k=i%8,o=c.g;
    if(i<2){ // intro: brass swell + timp roll
      for(const n of C[k===0?0:6])brass(o,t,n,4*b*0.95,0.07,0.6);
      for(let s=0;s<16;s++)timp(o,t+s*b/4,tr(R[k===0?0:6],12),0.05+s*0.018);
      if(i===0)cym(o,t,0.18);return 4*b}
    let x=0;for(const[n,d]of M[k]){brass(o,t+x*b,n,d*b*0.93,0.15,1);if(i%16>=10)strings(o,t+x*b,tr(n,12),d*b,0.035,0.05);x+=d}
    for(const n of C[k])strings(o,t,n,4*b,0.04,0.25);
    for(const[p,d]of[[0,.75],[1.5,.5],[2,1],[3,.5],[3.5,.5]])brass(o,t+p*b,R[k],d*b*0.85,0.08,0.35);
    for(const p of[0,0.75,1,2,2.5,3,3.25,3.5,3.75])snare(o,t+p*b,p%1===0?0.22:0.1);
    timp(o,t,tr(R[k],12),0.45);timp(o,t+2*b,tr(R[k],19),0.35);
    if(k===0)cym(o,t,0.22);return 4*b}};
}
{ // 2. Cavern exploration: D minor, 76bpm + 3. battle layer
  const P=[['D3','F3','A3','D2'],['Bb2','D3','F3','Bb1'],['G2','Bb2','D3','G1'],['A2','C#3','E3','A1']];
  const PEN=['D5','F5','G5','A5','C6','D6','A4'];
  TRACKS.explore={bar(c,t,i){const b=60/76,ch=P[(i>>1)&3],o=c.g;
    if(i%2===0)for(let j=0;j<3;j++)strings(o,t,ch[j],8*b,0.03,1.2);
    if(i%2===0)strings(o,t,ch[3],8*b,0.045,0.8);
    pizz(o,t,tr(ch[3],12),0.12);pizz(o,t+2.5*b,tr(ch[3],12),0.08);pizz(o,t+3*b,tr(ch[3],19),0.06);
    if(i%8===0){let x=0;for(const[n,d]of[['A3',1],['D4',1],['E4',.5],['F4',1.5]]){brass(o,t+x*b,n,d*b,0.07,0.25);x+=d}}
    if(i%8===4){let x=0;for(const[n,d]of[['G4',1],['F4',1],['D4',.5],['Bb3',1.5]]){brass(o,t+x*b,n,d*b,0.065,0.25);x+=d}}
    for(let k=0;k<2;k++)if(Math.random()<0.7)cel(o,t+((Math.random()*8)|0)*b/2,PEN[(Math.random()*PEN.length)|0],0.025);
    if(i%8===7)for(let s=0;s<8;s++)timp(o,t+s*b/2,'A2',0.04+s*0.025);
    battle(c.bg,t,b,4,ch[3],[tr(ch[0],12),tr(ch[1],12),tr(ch[2],12)]);
    return 4*b}};
}
{ // 4. Spy / tension cue: E minor, 100bpm
  const BL=['E2','E2','G2','E2','Bb2','A2','G2','D2'];
  TRACKS.tension={bar(c,t,i){const b=60/100,o=c.g;
    BL.forEach((n,k)=>pizz(o,t+k*b/2,n,k%4===0?0.2:0.12));
    if(i%2===0){strings(o,t,i%4===0?'B4':'C5',8*b,0.022,0.6);strings(o,t,'E4',8*b,0.02,0.6)}
    for(let k=0;k<4;k++){hat(o,t+(k+0.5)*b,0.06);hat(o,t+(k+0.75)*b,0.025)}
    if(i%4===2){let x=0;for(const[n,d]of[['E4',.5],['F4',.5],['E4',.5],['B3',1.5]]){brass(o,t+x*b,n,d*b,0.06,0.15);x+=d}}
    if(i%2===0)timp(o,t,'E2',0.3);
    if(Math.random()<0.5)cel(o,t+3.5*b,'B5',0.02);
    battle(c.bg,t,b,4,'E2',['E3','G3','B3']);
    return 4*b}};
}
{ // 5. Boss: arrangement after Holst, "Mars, the Bringer of War" (public domain) - 5/4 ostinato on G
  const RH=[0,1/3,2/3,1,1.5,2,3,3.5,4];
  const MEL={4:[['G3',5]],5:[['D4',5]],6:[['Db4',3],['C4',2]],7:[['G3',5]],8:[['Ab3',5]],9:[['Eb4',5]],10:[['D4',3],['Db4',2]],11:[['Ab3',5]]};
  const CH=[['Db4','F4','Ab4'],['D4','F4','A4'],['Eb4','G4','Bb4'],['D4','F#4','A4'],['Db4','F4','Ab4'],['C4','E4','G4'],['Db4','F4','Bb4'],['D4','G4','B4']];
  TRACKS.mars={bar(c,t,i){const b=60/168,s=i%24,o=c.g,v=s<4?0.12+s*0.03:0.22;
    for(const p of RH){wood(o,t+p*b,'G2',v);wood(o,t+p*b,'G3',v*0.6);if(s>=4)stacc(o,t+p*b,nf('G2'),s>=12?0.09:0.05)}
    if(s>=4)for(const p of[0,2,4])timp(o,t+p*b,'G2',s>=12?0.45:0.3);
    if(MEL[s]){let x=0;for(const[n,d]of MEL[s]){brass(o,t+x*b,n,d*b*0.97,0.13,0.5);brass(o,t+x*b,tr(n,-12),d*b*0.97,0.08,0.3);x+=d}}
    if(s>=12&&s<20){for(const n of CH[s-12]){brass(o,t,n,5*b*0.95,0.07,1);strings(o,t,tr(n,12),5*b,0.025,0.2)}
      for(let k=0;k<20;k++)snare(o,t+k*b/4,0.05+k*0.004);if(s%4===0)cym(o,t,0.25)}
    if(s>=20){for(const p of RH){for(const n of['G3','D4','Ab4'])brass(o,t+p*b,n,b*0.28,0.06,1);timp(o,t+p*b,'G2',0.3)}snare(o,t,0.3);if(s===23)cym(o,t+4*b,0.35)}
    return 5*b}};
}
{ // 6a. Victory fanfare (one-shot)
  TRACKS.victory={bars:3,bar(c,t,i){const b=60/120,o=c.g;
    const L=[[['G4',.5],['C5',.5],['E5',.5],['G5',2.5]],[['A4',.5],['D5',.5],['F5',.5],['A5',2.5]],[['G5',1],['C6',5]]][i];
    const CH=[['C4','E4','G4'],['F4','A4','C5'],['E4','G4','C5']][i];
    let x=0;for(const[n,d]of L){brass(o,t+x*b,n,d*b*0.95,0.16,1);x+=d}
    for(const n of CH){brass(o,t+1.5*b,n,(i===2?5:2.5)*b,0.06,0.6);strings(o,t,n,(i===2?6:4)*b,0.035,0.1)}
    timp(o,t,i===1?'F2':'C2',0.5);if(i===2){for(let s=0;s<12;s++)timp(o,t+s*b/6,'C2',0.1+s*0.03);cym(o,t+2*b,0.35)}
    if(i===0)cym(o,t,0.2);return 4*b}};
  // defeat sting
  TRACKS.defeat={bars:2,bar(c,t,i){const b=60/60,o=c.g;const CH=i===0?['C3','Eb3','G3']:['Ab2','C3','Eb3'];
    for(const n of CH){brass(o,t,n,3.5*b,0.07,0.3);strings(o,t,tr(n,12),4*b,0.03,0.3)}timp(o,t,i===0?'C2':'Ab1',0.5);return 4*b}};
  // 6b. Epilogue: somber-triumphant, F major
  const P=[['F3','A3','C4','F2'],['D3','F3','A3','D2'],['Bb2','D3','F3','Bb1'],['C3','E3','G3','C2']];
  const ML=[[['C4',1],['F4',1],['G4',1],['A4',1]],[['A4',2],['G4',1],['F4',1]],[['D4',1],['F4',1],['Bb4',2]],[['G4',3],['E4',1]],
            [['F4',1],['A4',1],['C5',2]],[['D5',2],['C5',1],['A4',1]],[['Bb4',1],['A4',1],['G4',1],['F4',1]],[['G4',2],['F4',2]]];
  TRACKS.epilogue={bar(c,t,i){const b=60/64,k=i%8,ch=P[k%4],o=c.g;
    for(let j=0;j<3;j++)strings(o,t,ch[j],4*b,0.03,0.8);strings(o,t,ch[3],4*b,0.04,0.6);
    let x=0;for(const[n,d]of ML[k]){brass(o,t+x*b,n,d*b*0.95,0.08,0.35);if(i>=8)strings(o,t+x*b,tr(n,12),d*b,0.03,0.15);x+=d}
    if(k>=4)timp(o,t,tr(ch[3],12),0.25);
    for(let s=0;s<4;s++)cel(o,t+s*b,tr(ch[s%3],24),0.018);
    if(k===4&&i>=8)cym(o,t,0.12);return 4*b}};
}
const Music={cur:null,want:undefined,
  play(name){if(!ac){this.want=name;return}
    if(this.cur&&this.cur.name===name&&!this.cur.ended)return;
    const now=ac.currentTime;
    if(this.cur){const c=this.cur;c.ended=true;for(const g of[c.g,c.bg]){g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.linearRampToValueAtTime(0,now+1.2)}setTimeout(()=>{c.g.disconnect();c.bg.disconnect()},3000)}

      if(ship){const tx=ship.x+ship.vx*0.25-W/2,ty=ship.y+ship.vy*0.25-H/2;const k=1-Math.exp(-dt*6);cam.x=lerp(cam.x,tx,k);cam.y=lerp(cam.y,ty,k)}
      drawWorld(t);
      if(state==='play'||state==='pause'||state==='dying')drawHUD(t);
      if(state==='epilogue'||state==='briefing'){}
      if(state==='pause'){overlay('PAUSED','Press P / Esc to resume · Q to quit to title',[`Mission ${level}   ·   Crystals ${got}/${need}   ·   Intel ${intelGot}/${intelTotal}   ·   Score ${score}`],'chrome');
        if(evidence.length){ctx.textAlign='left';ctx.font='bold 13px system-ui,sans-serif';ctx.fillStyle='#ff9a3c';const x=Math.max(16,W/2-300);let y=H*0.3+150;ctx.fillText('EVIDENCE LOG',x,y);y+=20;ctx.font='12px system-ui,sans-serif';ctx.fillStyle='#f0d8b8';
          for(const e of evidence.slice(-7)){for(const l of wrapLines(`[M${e.lv}] ${e.text}`,Math.min(600,W-32))){ctx.fillText(l,x,y);y+=16}}}}
      if(state==='levelDone')overlay(level===8?'EVIDENCE TRANSMITTED':'MISSION COMPLETE',level===8?'The comm relay crackles. Your files are on their way to the RSF.':'The lift hums upward with its glowing cargo.',[`Crystals: ${got}   Creatures destroyed: ${lvStats.kills}`,`Time: ${Math.round(lvStats.time)}s   Bonus: +${lvStats.bonus}`,`Score: ${score}`],'#8f8');
      if(state==='over')overlay('MISSION FAILED',overReason,[`Reached sector ${level}   ·   Final score ${score}`,score>=hi&&score>0?'★ NEW HIGH SCORE ★':`High score ${hi}`],'#f66');
      if(state==='briefing')drawBriefing(t);
      if(state==='epilogue')drawEpilogue(t);
    }
  }catch(e){console.error(e)}
  requestAnimationFrame(frame)}
